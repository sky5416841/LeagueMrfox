<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>遊戲中 HUD</title>
  <script src="/eel.js"></script>
  <link rel="stylesheet" href="hud.css?v=4">
</head>
<body>
  <div id="hud-titlebar" class="pywebview-drag-region">
    <span class="hud-title">▶▶ 遊戲中 HUD</span>
    <span class="hud-time" id="hud-time">--:--</span>
    <button class="hud-close" onclick="eel.hud_hide()()" title="隱藏（下一場自動顯示）">✕</button>
  </div>
  <div id="hud-note" class="hud-note">等待遊戲資料...</div>
  <div class="hud-keys">Ctrl+Alt+H 隱藏 · J 移動 · 1~5 敵方閃現 · +Shift 另一招</div>
  <div id="hud-body"></div>
  <script src="hud.js?v=4"></script>
</body>
</html>
